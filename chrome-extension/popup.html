<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .logo { font-size: 18px; }

    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8892b0;
      margin-bottom: 6px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #4ade80; }
    .dot.red { background: #f87171; }
    .dot.yellow { background: #fbbf24; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .tab-item:hover { background: #1a1a3e; }
    .tab-item.focused { background: #0f3460; }
    .tab-item .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .tab-item .focus-badge {
      font-size: 10px;
      background: #4ade80;
      color: #1a1a2e;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .tab-item input[type="radio"] {
      accent-color: #4ade80;
      cursor: pointer;
    }

    .empty-state {
      color: #8892b0;
      font-style: italic;
      text-align: center;
      padding: 8px 0;
    }

    .global-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .global-status.ok { background: #0a2e1a; color: #4ade80; }
    .global-status.warn { background: #2e1a0a; color: #fbbf24; }
    .global-status.err { background: #2e0a0a; color: #f87171; }

    #refresh-btn {
      background: none;
      border: 1px solid #334155;
      color: #8892b0;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-left: auto;
    }
    #refresh-btn:hover { border-color: #4ade80; color: #4ade80; }

    .mode-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .mode-model {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }
    .mode-thinking {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .mode-thinking.extended { background: #fbbf24; color: #1a1a2e; }
    .mode-thinking.off { background: #334155; color: #8892b0; }
    .mode-unknown { color: #8892b0; font-style: italic; }

    .error-text { color: #f87171; font-size: 12px; }
  </style>
</head>
<body>
  <h1><span class="logo">&#9670;</span> Gemini Bridge</h1>

  <div class="section">
    <div class="section-title">Server Connection</div>
    <div class="status-row" id="server-status">
      <span class="dot" id="server-dot"></span>
      <span id="server-text">Checking...</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Active Model</div>
    <div id="mode-display"></div>
  </div>

  <div class="section">
    <div class="section-title">Gemini Tabs</div>
    <div id="tab-list"></div>
  </div>

  <div class="section">
    <div id="global-status"></div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
    <button id="refresh-btn">&#x21bb; Refresh</button>
    <span id="error-text" class="error-text"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
