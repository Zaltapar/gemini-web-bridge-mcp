name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node --check server.js
      - run: node --check chrome-extension/background.js
      - run: node --check chrome-extension/content.js
      - run: node --check chrome-extension/popup.js
      - run: node --check scripts/export-cookies.mjs
      - run: |
          for f in linux/*.sh; do bash -n "$f"; done
